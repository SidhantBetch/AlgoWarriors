<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AlgoWarrior</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">⚙</span>
            <span class="logo-text">Algo<span class="highlight">Warrior</span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="About/index.html">About</a></li>
            <li><a href="Dashboard/index.html">Dashboard</a></li>
            <li><a href="Jobs/index.html">Jobs</a></li>
            <li><a href="Contact/index.html">Contact</a></li>
        </ul>
    </nav>
    <div class="register-container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access your applicant dashboard.</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div id="errorMsg" style="color: #ef4444; margin-bottom: 10px; display: none;"></div>
            <label>Email Address</label>
            <input type="email" id="logEmail" placeholder="name@example.com" required>
            <label>Password</label>
            <input type="password" id="logPassword" placeholder="••••••••" required>
            <button type="submit" class="signup-btn" id="logBtn">Log In</button>
            <p style="text-align: center; margin-top: 15px; color: #94a3b8;">
                Don't have an account? <a href="register.html" style="color: #0ea5e9;">Sign up</a>
            </p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
